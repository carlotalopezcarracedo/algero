<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Villa Barbarina Nature Resort | Alghero, Sardegna</title>
    <meta name="description" content="Un resort 4 stelle tra ulivi, vigne e il mare di Alghero. Scopri camere, ristorante, itinerari e prenotazione diretta." />
    <meta name="theme-color" content="#1d2a20" />
    <style>
      #site-loader{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;overflow:hidden;color:#f5f1e8;background:#1d2a20;transition:transform .9s cubic-bezier(.22,1,.36,1),visibility .9s;transform-origin:top}
      #site-loader:before{position:absolute;inset:-20%;background:radial-gradient(circle at 25% 30%,rgba(197,181,139,.12),transparent 28%),repeating-radial-gradient(circle at 72% 68%,transparent 0 20px,rgba(245,241,232,.045) 21px 22px);content:"";animation:loader-drift 5s ease-in-out infinite alternate}
      .site-loader__inner{position:relative;display:grid;width:min(76vw,360px);place-items:center;gap:1.35rem}
      .site-loader__mark{position:relative;width:100%;padding:1.4rem 0;overflow:hidden}
      .site-loader__mark img{width:100%;height:auto;animation:loader-logo 1.1s cubic-bezier(.22,1,.36,1) both}
      .site-loader__line{width:100%;height:1px;overflow:hidden;background:rgba(245,241,232,.18)}
      .site-loader__line:after{display:block;width:100%;height:100%;background:#b98d69;content:"";animation:loader-line 1.25s cubic-bezier(.22,1,.36,1) infinite;transform-origin:left}
      .site-loader__label{font:600 10px/1.2 Manrope,Arial,sans-serif;letter-spacing:.26em;text-transform:uppercase;opacity:.7}
      html.site-ready #site-loader{visibility:hidden;transform:translateY(-102%)}
      html.site-ready .site-loader__inner{opacity:0;transition:opacity .24s ease}
      html.intro-seen #site-loader{display:none}
      html:not(.site-ready):not(.intro-seen) body{overflow:hidden}
      @keyframes loader-logo{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
      @keyframes loader-line{0%{transform:scaleX(0);transform-origin:left}48%{transform:scaleX(1);transform-origin:left}52%{transform:scaleX(1);transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
      @keyframes loader-drift{to{transform:translate3d(1.5%,-1%,0) scale(1.02)}}
      @media (prefers-reduced-motion:reduce){#site-loader{transition:opacity .15s}.site-loader__mark img,.site-loader__line:after,#site-loader:before{animation:none!important}html.site-ready #site-loader{opacity:0;transform:none}}
    </style>
    <script>
      (() => {
        try {
          if (sessionStorage.getItem('villa-intro-seen') === '1') document.documentElement.classList.add('intro-seen', 'site-ready');
        } catch (_) {}
        const startedAt = performance.now();
        let finished = false;
        const finish = () => {
          if (finished) return;
          finished = true;
          const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
          const wait = reduced ? 0 : Math.max(0, 650 - (performance.now() - startedAt));
          setTimeout(() => {
            document.documentElement.classList.add('site-ready');
            try { sessionStorage.setItem('villa-intro-seen', '1'); } catch (_) {}
          }, wait);
        };
        addEventListener('load', finish, { once: true });
        setTimeout(finish, 2200);
      })();
    </script>
    
    <!-- Open Graph -->
    <meta property="og:locale" content="it_IT" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Villa Barbarina Nature Resort | Alghero, Sardegna" />
    <meta property="og:description" content="Scopri Villa Barbarina, resort 4 stelle immerso nella campagna di Alghero. Camere eleganti, piscina, ristorante tipico, posizione ideale per esplorare la Sardegna nord-occidentale." />
    <meta property="og:url" content="https://www.villabarbarina.com/" />
    <meta property="og:site_name" content="Villa Barbarina Nature Resort" />
    <meta property="og:image" content="https://www.villabarbarina.com/images_offerta/villa-barbarina-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Two-typeface hospitality system with full Italian character support. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!--
      THESIS: Villa Barbarina is a calm Mediterranean resort experience designed around discovery, stay, territory and direct booking.
      OWN-WORLD: warm mineral canvas, vegetal green, restrained terracotta, real property photography and one consistent twelve-column grid.
      STORY: understand the place, feel the atmosphere, choose a room, discover the table and coast, then book without friction.
      FIRST VIEWPORT: one clear property photograph, one message and two useful actions.
      FORM: coherent hospitality UX with balanced image/text compositions, precise interaction and no decorative clutter.
      FINISH: desktop, mobile, keyboard, forms and production routes are verified before publication.
    -->
    <div id="site-loader" role="status" aria-label="Villa Barbarina sta caricando">
      <div class="site-loader__inner">
        <div class="site-loader__mark"><img src="%BASE_URL%images/villa/logo-bianco.png" alt="Villa Barbarina Hotel &amp; Restaurant" width="527" height="118" /></div>
        <div class="site-loader__line" aria-hidden="true"></div>
        <span class="site-loader__label">Natura · Ospitalità · Sardegna</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
